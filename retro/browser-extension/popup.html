<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><style>
body{font:13px system-ui,sans-serif;width:320px;margin:0;padding:10px;color:#222}h1{font-size:14px;margin:0 0 8px}label{display:block;margin:6px 0 2px;color:#555}
input,button{font:inherit}input{width:100%;box-sizing:border-box;padding:4px}button{padding:5px 10px;margin:6px 4px 0 0;cursor:pointer}.muted{color:#777}.err{color:#b00020}
.on{color:#1a7f37;font-weight:600}#status{margin:8px 0;padding:6px;background:#f3f4f6;border-radius:4px}
</style></head><body>
<h1>Parcours applicatif</h1>
<div id="status" class="muted">…</div>
<div id="start">
  <label>Application (libellé connu du hub)</label><input id="app" placeholder="gestion">
  <label>Nom du parcours</label><input id="name" placeholder="création d'un client">
  <label>Testeur</label><input id="tester" placeholder="freg">
  <button id="btnStart">Démarrer l'enregistrement</button>
</div>
<div id="running" hidden>
  <label>Repère</label><input id="label" placeholder="ex. après validation du devis">
  <button id="btnMark">Poser un repère</button>
  <button id="btnStop">Terminer</button>
</div>
<p class="muted" style="margin-top:10px"><a href="#" id="opts">Options</a> (relais, périmètre, valeurs des champs) · <span id="stats"></span></p>
<script src="popup.js"></script></body></html>
