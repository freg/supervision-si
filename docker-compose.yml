      - VITE_DBA_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/dba
      - VITE_SCHEMA_ANALYZER_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/schema-analyzer
      # Documents joints -- onglet GED (livraison #167) -- même API
