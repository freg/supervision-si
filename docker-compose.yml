      - VITE_IMAP_CLIENT_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/imap-client
      # Exploration réseau -- onglet hub (livraison #233), backend
      # #233 (item 20).
      - VITE_NETWORK_AGENT_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/network-agent
      # Rétro-ingénierie -- onglet hub (livraison #243), backend #243
