      - NETWORK_AGENT_API_URL=http://${HOST_IP:-localhost}:${NETWORK_AGENT_HOST_PORT:-15000}
      # RIGHTS_API_URL -- livraison #316, OPT-IN comme partout ailleurs.
      # Gardé sur les 8 routes d'écriture (équipements, import
