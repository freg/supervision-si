      - VITE_GED_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/ged
      # Tunnels SSH -- onglet hub (livraison #175), backend #159.
      - VITE_SSH_TUNNELS_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/ssh-tunnels
      # SNMP -- onglet hub (livraison #227), backend #212-213.
      - VITE_SNMP_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/snmp
      # netmap-orchestrator-api (livraison #389) -- routé via la
      # passerelle (voir tls-proxy/render_nginx_conf.py), prêt pour
