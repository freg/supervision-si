services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      - MEMCACHED_HOST=memcached
      - MEMCACHED_PORT=11211
      - DATA_DIR=/app/data
      - CACHE_TTL_SECONDS=300
      # RIGHTS_API_URL -- livraison #320, OPT-IN comme partout ailleurs.
      # Gardé UNIQUEMENT sur la gestion des sources (from-selection,
      # register, delete, restore) -- JAMAIS /ingest, appelé par
      # plusieurs pipelines automatisés (pipeline/, pixel-grid/bridge,
      # imap-client-api, connectors/zenoss_legacy) sans contexte
      # utilisateur/groupes -- le garder casserait ces flux.
      - RIGHTS_API_URL=${CENTRAL_API_RIGHTS_API_URL:-}
    volumes:
      # Persistance des fichiers hors du conteneur — survit aux redémarrages
      - api_data:/app/data
    depends_on:
      - memcached

  pipeline:
    build: ./pipeline
    environment:
      - API_BASE_URL=http://api:5000
      - PUSH_INTERVAL_SECONDS=30
      - SOURCE_NAME=supervision_demo
    depends_on:
      - api

  memcached:
    image: memcached:1.6-alpine
    # Pas de port exposé à l'hôte : Memcached n'est accédé que par l'API,
    # en interne au réseau Docker Compose.

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # Le frontend tourne dans le navigateur de l'hôte, pas dans le réseau
      # Docker interne : il doit donc viser une adresse joignable depuis
      # le poste qui ouvre le navigateur. HOST_IP est injectée au lancement
      # (voir scripts/run.sh) ; fallback sur localhost si non définie
      # (cas où le navigateur tourne sur la même machine que Docker).
      # Entrée UNIQUE par chemin (décidé en cours de session, voir
      # tls-proxy/README.md) : un seul GATEWAY_PORT pour tout, plus un
      # port par API — /api/<nom>/ dispatché par tls-proxy.
      - GATEWAY_PORT=${GATEWAY_PORT:-6443}
      - VITE_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/supervision
      - VITE_PIXEL_GRID_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/pixel-grid
      - VITE_TICKETS_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/tickets
      - VITE_IPAM_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/ipam
      - VITE_OPTICK_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/optick
      - VITE_ZENOSS_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/zenoss
      # cacti-api (livraison #362) -- onglet Cacti du frontend,
      # jamais construit jusqu'ici malgré un backend prêt depuis
      # longtemps (voir cacti/README.md, nouvellement créé).
      - VITE_CACTI_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/cacti
      - VITE_TTSGU_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/tts-gu
      - VITE_OWNCLOUD_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/owncloud
      - VITE_CACTI_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/cacti
      - VITE_OWNCLOUD_SEARCH_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/owncloud-search
      - VITE_GEO_IMPORT_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/geo-import
    depends_on:
      - api

  pixel-grid-postgres:
    image: postgres:16-alpine
    ports:
      # Port centralisé dans .env — évite volontairement 5432/5433
      # (trop communs) et toute la plage déjà utilisée par ailleurs.
      - "${PIXEL_GRID_POSTGRES_PORT:-6543}:5432"
    environment:
      - POSTGRES_DB=pixelgrid
      - POSTGRES_USER=pixelgrid
      - POSTGRES_PASSWORD=pixelgrid
    volumes:
      - pixel_grid_pg_data:/var/lib/postgresql/data
      # Appliqué automatiquement au premier démarrage par l'image
      # officielle (mécanisme /docker-entrypoint-initdb.d/).
      - ./pixel-grid/data-generator/schema.postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql

  pixel-grid-api:
    build:
      context: .
      dockerfile: pixel-grid/api/Dockerfile
    environment:
      # MEMCACHED_HOST -- livraison #145, tampon de logs partagé (voir
      # shared/log_buffer.py) -- ce service tourne avec 2 workers
      # Gunicorn, mémoire NON partagée entre eux.
      - MEMCACHED_HOST=memcached
      # Bascule de backend : "sqlite" (défaut) ou "postgres".
      - DB_BACKEND=${PIXEL_GRID_BACKEND:-sqlite}
      - PIXEL_GRID_DB_PATH=/data/timeseries.db
      # Utilisées seulement si DB_BACKEND=postgres. Port 5432 ici :
      # communication interne au réseau Docker (conteneur à conteneur),
      # indépendante du port publié à l'hôte (PIXEL_GRID_POSTGRES_PORT).
      - PGHOST=pixel-grid-postgres
      - PGPORT=5432
      - PGUSER=pixelgrid
      - PGPASSWORD=pixelgrid
      - PGDATABASE=pixelgrid
      # Position de repli pour les événements sans localisation connue —
      # pré-remplit l'entrée "__default__" au tout premier démarrage
      # seulement (éditable ensuite dans l'onglet Géolocalisation).
      - PIXEL_GRID_DEFAULT_LAT=${PIXEL_GRID_DEFAULT_LAT:-}
      - PIXEL_GRID_DEFAULT_LON=${PIXEL_GRID_DEFAULT_LON:-}
      # Géolocalisation IP publique — jamais appelé pour une IP privée
      # (voir .env.example pour le détail). Repli vide volontaire ici
      # (pas de valeur par défaut contenant des accolades imbriquées
      # dans ce fichier — ambiguïté possible selon la version de
      # Docker Compose) : la vraie valeur par défaut vit dans .env et,
      # en dernier recours, dans le code Python lui-même.
      - GEOIP_PROVIDER_URL=${GEOIP_PROVIDER_URL:-}
      - GEOIP_TIMEOUT_SECONDS=${GEOIP_TIMEOUT_SECONDS:-5}
      - GEOIP_MIN_INTERVAL_SECONDS=${GEOIP_MIN_INTERVAL_SECONDS:-1.5}
      # RIGHTS_API_URL -- livraison #317, OPT-IN comme partout ailleurs.
      # Gardé sur les 4 routes d'écriture (géolocalisations, scan,
      # enregistrement d'IP) -- jamais la lecture/agrégation.
      - RIGHTS_API_URL=${PIXEL_GRID_RIGHTS_API_URL:-}
    volumes:
      # La base SQLite est générée par
      # pixel-grid/data-generator/load_sqlite.sh, exécuté en dehors de
      # Docker (dépend de jq/awk/sqlite3 sur l'hôte) — ce montage la
      # rend visible au conteneur à l'endroit attendu par
      # PIXEL_GRID_DB_PATH. Sans effet en mode postgres.
      - ./pixel-grid/data-generator:/data
    depends_on:
      - memcached
    # Pas de dépendance forcée à pixel-grid-postgres : le backend sqlite
    # (défaut) n'en a pas besoin. En mode postgres, démarre les deux :
    # docker compose up pixel-grid-postgres pixel-grid-api

  pixel-grid-bridge:
    # Contexte changé (livraison #351) -- était "./pixel-grid/bridge"
    # (racine locale, jamais accès à shared/), désormais racine du
    # projet + dockerfile explicite -- même motif que les services
    # plus récents (ex. relations-api) -- nécessaire pour copier
    # shared/log_buffer.py (câblage /logs, backlog item 8).
    build:
      context: .
      dockerfile: pixel-grid/bridge/Dockerfile
    environment:
      - PIXEL_GRID_API_URL=http://pixel-grid-api:5000
      - SUPERVISION_API_URL=http://api:5000
      - BRIDGE_INTERVAL_SECONDS=${BRIDGE_INTERVAL_SECONDS:-60}
      - BRIDGE_WINDOW_DAYS=${BRIDGE_WINDOW_DAYS:-30}
      - BRIDGE_MAX_POINTS_PER_TYPE=${BRIDGE_MAX_POINTS_PER_TYPE:-5000}
    depends_on:
      - pixel-grid-api
      - api
      - memcached

  tickets-postgres:
    image: postgres:16-alpine
    ports:
      - "${TICKETS_POSTGRES_PORT:-6545}:5432"
    environment:
      - POSTGRES_DB=tickets
      - POSTGRES_USER=tickets
      - POSTGRES_PASSWORD=tickets
    volumes:
      - tickets_pg_data:/var/lib/postgresql/data
      - ./tickets/data-generator/schema.postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql

  tickets-api:
    build:
      context: .
      dockerfile: tickets/api/Dockerfile
    environment:
      # MEMCACHED_HOST -- livraison #145, tampon de logs partagé (voir
      # shared/log_buffer.py) -- ce service tourne avec 2 workers
      # Gunicorn, mémoire NON partagée entre eux.
      - MEMCACHED_HOST=memcached
      - DB_BACKEND=${TICKETS_BACKEND:-sqlite}
      - TICKETS_DB_PATH=/data/tickets.db
      - PGHOST=tickets-postgres
      - PGPORT=5432
      - PGUSER=tickets
      - PGPASSWORD=tickets
      - PGDATABASE=tickets
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # https:// — ce port n'est plus publié directement que par
      # tls-proxy (voir plus bas) ; Google exige de toute façon HTTPS
      # sur les URI de callback OAuth hors localhost pur. Entrée unique
      # par chemin : /api/tickets/ (voir tls-proxy/README.md).
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-https://localhost:${GATEWAY_PORT:-6443}/api/tickets/oauth/google/callback}
      # Import direct des membres d'un groupe Keycloak (ex. "demandeurs")
      # comme comptes locaux -- mêmes identifiants admin que
      # keycloak-backup, réutilisés ici plutôt que dupliqués. Jamais
      # via tls-proxy : trafic conteneur-à-conteneur interne au réseau
      # Docker, pas navigateur.
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080/auth
      - KEYCLOAK_REALM=supervision-si
      - KEYCLOAK_ADMIN_USER=${KEYCLOAK_ADMIN_USER:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-change-me}
      # Sauvegardes versionnées -- voir .env.example et
      # tickets/README.md pour le raisonnement complet.
      - TICKETS_BACKUP_RETENTION_COUNT=${TICKETS_BACKUP_RETENTION_COUNT:-30}
      - TICKETS_BACKUP_PERIODIC_INTERVAL_HOURS=${TICKETS_BACKUP_PERIODIC_INTERVAL_HOURS:-24}
      - TICKETS_BACKUP_DISABLE_PERIODIC=${TICKETS_BACKUP_DISABLE_PERIODIC:-}
      # RIGHTS_API_URL -- livraison #324, OPT-IN comme partout ailleurs.
      # GROS CHANTIER traité en plusieurs passes -- cette première
      # passe (#324) garde UNIQUEMENT le cluster console DB/SQL, de
      # loin le plus dangereux du module : POST /backups, POST
      # /backups/<file>/restore, PUT /db/tables/<t>/rows/<id>, POST
      # /db/sql/execute. Les autres routes d'écriture (tickets, users,
      # sites, calendrier...) seront traitées dans des passes
      # ultérieures, voir tickets/README.md.
      - RIGHTS_API_URL=${TICKETS_RIGHTS_API_URL:-}
    volumes:
      # TICKETS_DATA_DIR (.env, optionnel) : sort ce dossier de
      # l'arborescence du projet -- même logique que KEYCLOAK_IMPORT_DIR/
      # KEYCLOAK_BACKUP_DIR. Important ici particulièrement : c'est ce
      # dossier qui contient tickets.db (base réelle, pas un secret
      # rendu) -- un déploiement qui supprime puis réextrait le projet
      # à chaque livraison (plutôt que d'extraire par-dessus l'existant)
      # perdrait cette base à chaque fois si elle reste dans
      # l'arborescence du projet. Vide = ./tickets/data-generator comme
      # avant. Jamais de "~" (ni docker-compose ni ce montage ne
      # l'étendent) -- un chemin absolu explicite à la place.
      - ${TICKETS_DATA_DIR:-./tickets/data-generator}:/data
    depends_on:
      - memcached
    # Bug réel rencontré et corrigé (livraison #135) : depends_on vers
    # "keycloak" retiré ici -- Keycloak vit désormais dans un AUTRE
    # docker-compose.yml (gateway/), Compose ne permet pas un
    # depends_on cross-stack. KEYCLOAK_INTERNAL_URL ci-dessus continue
    # de fonctionner (réseau Docker PARTAGÉ entre les deux stacks,
    # voir networks: en bas de ce fichier) -- seul l'ORDRE de démarrage
    # garanti disparaît, pas la joignabilité elle-même.
    # Backend sqlite (défaut) : schéma appliqué automatiquement au
    # démarrage de l'API (idempotent, CREATE TABLE IF NOT EXISTS).
    # Backend postgres : appliqué automatiquement par tickets-postgres
    # au premier démarrage.

  tickets-portal:
    build:
      context: .
      dockerfile: tickets/portal/Dockerfile
    environment:
      - GATEWAY_PORT=${GATEWAY_PORT:-6443}
      - VITE_TICKETS_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/tickets
      # Client OIDC "tickets-portal" — déjà défini dans
      # keycloak/realm-template.json depuis le début, même mécanique que
      # le hub (voir hub/README.md pour le détail du flux et les deux
      # accrocs réels rencontrés en le mettant en place la première fois).
      - VITE_KEYCLOAK_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/auth
      - VITE_KEYCLOAK_REALM=supervision-si
      - VITE_PREFS_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/prefs
      # Documents joints (livraison #160) -- TicketDocuments.jsx parle
      # directement à ged-api, jamais via tickets-api (même
      # raisonnement de couplage FAIBLE qu'ailleurs dans ce projet).
      - VITE_GED_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/ged
    depends_on:
      - tickets-api
      # keycloak retiré (livraison #135) -- voir tickets-api ci-dessus
      # pour le raisonnement complet.
      - prefs-api

  dba-api:
    build:
      context: .
      dockerfile: dba/api/Dockerfile
    environment:
      # MEMCACHED_HOST -- livraison #145, tampon de logs partagé (voir
      # shared/log_buffer.py) -- ce service tourne avec 2 workers
      # Gunicorn, mémoire NON partagée entre eux.
      - MEMCACHED_HOST=memcached
      - DBA_DB_PATH=/data/dba.db
      # Branchement rights-api (livraison #292) -- OPT-IN, même motif
      # que ssh-tunnels-api/ldap-admin-api. Jamais actif par défaut.
      - RIGHTS_API_URL=${DBA_RIGHTS_API_URL:-}
      # Connexion(s) par défaut pré-configurées, amorçage idempotent
      # au démarrage (voir dba/api/app.py, seed_connections_from_env)
      # -- distinctes des bases IPAM/Optick/Zenoss/OwnCloud/Cacti,
      # jamais réutilisées ici. Vide = rien d'amorcé.
      - HUB_SGBD_MYSQL_HOST=${HUB_SGBD_MYSQL_HOST:-}
      - HUB_SGBD_MYSQL_PORT=${HUB_SGBD_MYSQL_PORT:-3306}
      - HUB_SGBD_MYSQL_USER=${HUB_SGBD_MYSQL_USER:-}
      - HUB_SGBD_MYSQL_PASSWORD=${HUB_SGBD_MYSQL_PASSWORD:-}
      - HUB_SGBD_MYSQL_DATABASE=${HUB_SGBD_MYSQL_DATABASE:-}
      - HUB_SGBD_POSTGRES_HOST=${HUB_SGBD_POSTGRES_HOST:-}
      - HUB_SGBD_POSTGRES_PORT=${HUB_SGBD_POSTGRES_PORT:-5432}
      - HUB_SGBD_POSTGRES_USER=${HUB_SGBD_POSTGRES_USER:-}
      - HUB_SGBD_POSTGRES_PASSWORD=${HUB_SGBD_POSTGRES_PASSWORD:-}
      - HUB_SGBD_POSTGRES_DATABASE=${HUB_SGBD_POSTGRES_DATABASE:-}
    volumes:
      # DBA_DATA_DIR (.env, optionnel) : sort ce dossier de
      # l'arborescence du projet -- même logique que TICKETS_DATA_DIR
      # (voir docker-compose.yml, service tickets-api, pour le bug réel
      # que ça évite). Contient dba.db -- CONNEXIONS SGBD CONFIGURÉES,
      # IDENTIFIANTS INCLUS EN CLAIR (voir dba/README.md, décision de
      # sécurité assumée). Vide = ./dba/data comme repli.
      - ${DBA_DATA_DIR:-./dba/data}:/data
    depends_on:
      - memcached

  schema-analyzer-api:
    # Livraison #151, backlog BACKLOG.md #5 -- décision d'architecture
    # prise avec la personne avant de coder : module dédié, s'appuyant
    # sur dba-api pour la couche accès (connexions déjà gérées là-bas)
    # plutôt que de la reconstruire -- voir schema-analyzer/README.md.
    build:
      context: .
      dockerfile: schema-analyzer/api/Dockerfile
    environment:
      # MEMCACHED_HOST -- tampon de logs partagé (voir
      # shared/log_buffer.py) -- ce service tourne avec 2 workers
      # Gunicorn, mémoire NON partagée entre eux.
      - MEMCACHED_HOST=memcached
      # DBA_API_BASE -- adresse INTERNE au réseau Docker (jamais via
      # tls-proxy, trafic conteneur-à-conteneur, pas navigateur --
      # même motif que KEYCLOAK_INTERNAL_URL dans prefs-api).
      - DBA_API_BASE=http://dba-api:5000
      # RIGHTS_API_URL -- livraison #319, OPT-IN comme partout ailleurs.
      # Gardé sur create/update/delete_relation + import-proposals --
      # jamais /analyze ni /relations/validate (confirmées lecture
      # pure, aucun effet de bord).
      - RIGHTS_API_URL=${SCHEMA_ANALYZER_RIGHTS_API_URL:-}
    volumes:
      # SCHEMA_ANALYZER_DATA_DIR (.env, optionnel) : même logique que
      # DBA_DATA_DIR/TICKETS_DATA_DIR -- sort schema-analyzer.db
      # (relations persistées, livraison #152) de l'arborescence du
      # projet. Vide = ./schema-analyzer/data comme repli.
      - ${SCHEMA_ANALYZER_DATA_DIR:-./schema-analyzer/data}:/data
    depends_on:
      - memcached
      - dba-api

  ged-api:
    # Livraison #157-#158 -- gestion électronique de documents.
    # #157 : fondation HOMEMADE (stockage disque + SQLite). #158 :
    # "allons-y pour Mayan EDMS" -- le stockage/versioning des
    # fichiers est désormais RELAYÉ vers Mayan (voir mayan/,
    # ged/api/mayan_client.py) ; seule la table de liaison polymorphe
    # reste locale (SQLite, ged.db). Voir ged/README.md pour le
    # raisonnement complet.
    build:
      context: .
      dockerfile: ged/api/Dockerfile
    environment:
      # MEMCACHED_HOST -- tampon de logs partagé (voir
      # shared/log_buffer.py) -- ce service tourne avec 2 workers
      # Gunicorn, mémoire NON partagée entre eux.
      - MEMCACHED_HOST=memcached
      - GED_MAX_UPLOAD_MB=${GED_MAX_UPLOAD_MB:-50}
      # MAYAN_BASE -- adresse INTERNE au réseau Docker PARTAGÉ (voir
      # mayan/docker-compose.yml, stack SÉPARÉ, livraison #158) --
      # jamais via tls-proxy, trafic conteneur-à-conteneur. Identifiants
      # : MÊME compte que MAYAN_AUTOADMIN_USERNAME/PASSWORD dans
      # mayan/docker-compose.yml -- DOIVENT rester synchronisés entre
      # les deux stacks (aucune vérification automatique, à surveiller
      # manuellement si l'un des deux change).
      - MAYAN_BASE=http://mayan-app:8000
      - MAYAN_USERNAME=${MAYAN_AUTOADMIN_USERNAME:-admin}
      - MAYAN_PASSWORD=${MAYAN_AUTOADMIN_PASSWORD:-change-me}
      # RIGHTS_API_URL -- livraison #311, OPT-IN comme partout ailleurs.
      # Gardé sur les 5 routes d'écriture (créer/supprimer un document,
      # nouvelle version, créer/supprimer un lien) -- jamais la lecture.
      - RIGHTS_API_URL=${GED_RIGHTS_API_URL:-}
    volumes:
      # GED_DATA_DIR (.env, optionnel) : même logique que
      # SCHEMA_ANALYZER_DATA_DIR/DBA_DATA_DIR -- sort ged.db (table de
      # liaisons UNIQUEMENT depuis #158, les fichiers eux-mêmes vivent
      # désormais dans le volume Mayan, voir mayan/docker-compose.yml)
      # de l'arborescence du projet. Vide = ./ged/data comme repli.
      - ${GED_DATA_DIR:-./ged/data}:/data
    depends_on:
      - memcached

  file-manager-api:
    # Livraison #396, backlog item 26 -- nouvelle tuile/outil
    # "gestionnaire de fichiers". Agrège ged-api, ssh-tunnels-api,
    # et gère l'espace protégé du hub (volet 3). Pas d'état propre
    # persisté pour les documents/montages (il agrège les sources).
    build:
      context: .
      dockerfile: file-manager/api/Dockerfile
    environment:
      - MEMCACHED_HOST=memcached
      - MEMCACHED_PORT=11211
      # URLs internes (réseau Docker partagé) -- jamais via tls-proxy
      - GED_API_INTERNAL_URL=${GED_API_INTERNAL_URL:-http://ged-api:5000}
      - SSH_TUNNELS_API_INTERNAL_URL=${SSH_TUNNELS_API_INTERNAL_URL:-http://ssh-tunnels-api:5000}
      # Espace protégé du hub (volet 3) -- répertoire sur l'hôte,
      # accessible aussi bien depuis le hub que directement
      - FILE_MANAGER_PROTECTED_DIR=${FILE_MANAGER_PROTECTED_DIR:-/protected-space}
      - FILE_MANAGER_DB_PATH=/data/file-manager.db
      - FILE_MANAGER_MAX_LISTING_ITEMS=${FILE_MANAGER_MAX_LISTING_ITEMS:-1000}
      # Branchement rights-api -- OPT-IN, jamais actif par défaut.
      # Protège l'accès à l'espace protégé (volet 3) : seuls les
      # groupes autorisés (admin_hub par défaut) peuvent y accéder.
      - RIGHTS_API_URL=${FILE_MANAGER_RIGHTS_API_URL:-}
    volumes:
      # FILE_MANAGER_DATA_DIR : SQLite de l'index espace protégé
      - ${FILE_MANAGER_DATA_DIR:-./file-manager/data}:/data
      # FILE_MANAGER_PROTECTED_DIR : répertoire protégé de l'hôte
      - ${FILE_MANAGER_PROTECTED_DIR:-./file-manager/protected}:/protected-space
    depends_on:
      - memcached
      - ged-api
      - ssh-tunnels-api

  ssh-tunnels-api:
    # Livraison #159, backlog BACKLOG.md #2 -- supervision de
    # tunnels SSH (ssh -L) et partages SSHFS. Clés SSH : chemin
    # protégé PARAMÉTRÉ (SSH_KEYS_DIR).
    #
    # ⚠️ Montage LECTURE-ÉCRITURE depuis la livraison #277 -- ce
    # service GÉNÈRE et SUPPRIME désormais des clés lui-même
    # (demandé explicitement), inversant le choix initial de #159
    # ("monté en LECTURE SEULE -- ce service ne génère ni ne stocke
    # jamais de clé lui-même") -- CONFIRMÉ EXPLICITEMENT avec la
    # personne (2026-09-04) avant ce changement, un vrai changement
    # de posture sécurité pour ce service précis.
    #
    # Montage SSHFS RÉEL (livraison #180, demandé explicitement) --
    # privilèges FUSE requis, TOUS documentés ici plutôt que devinés :
    # - cap_add SYS_ADMIN : nécessaire pour l'appel système `mount()`
    #   sous-jacent à sshfs/FUSE -- un conteneur SANS ce privilège ne
    #   peut PAS monter de système de fichiers, quelle que soit la
    #   méthode (confirmé par la documentation FUSE elle-même).
    # - devices /dev/fuse : le périphérique FUSE lui-même, absent
    #   d'un conteneur par défaut (contrairement à /dev/null etc.).
    # - security_opt apparmor:unconfined : AppArmor (activé par
    #   défaut sur Ubuntu/Debian, l'hôte visé par ce projet, voir
    #   scripts/run.sh) bloque `mount()` en conteneur par défaut MÊME
    #   avec SYS_ADMIN -- nécessaire en pratique sur ce type d'hôte,
    #   documentation FUSE-in-Docker converge sur ce point. Restreint
    #   à CE service précis, jamais un défaut global du projet.
    # ⚠️ Non vérifié dans cet environnement (sshfs non installable,
    # réseau restreint) -- à confirmer au premier vrai montage.
    build:
      context: .
      dockerfile: ssh-tunnels/api/Dockerfile
    environment:
      - MEMCACHED_HOST=memcached
      - SSH_KEYS_DIR=/keys
      - SSH_MOUNTS_BASE_DIR=/mounts
      # Branchement rights-api (livraison #289) -- OPT-IN via .env,
      # jamais actif par défaut : activer le gating sans que la
      # personne ait déjà un groupe admin_hub assigné dans Keycloak
      # bloquerait ses propres actions sans prévenir, en pleine
      # session de test. Vide/absent = gating désactivé (comportement
      # inchangé) -- à activer explicitement une fois prêt.
      - RIGHTS_API_URL=${SSH_TUNNELS_RIGHTS_API_URL:-}
      # Authentification par mot de passe (livraison #210, backlog
      # item 12) -- optionnel : absent = comportement inchangé (aucune
      # connexion par mot de passe possible, seul le mode par clé
      # fonctionne, comme avant #210). Contrairement aux secrets de
      # démarrage (.env.encrypted, #202-205), CETTE phrase de passe
      # doit rester DISPONIBLE EN CONTINU dans l'environnement de ce
      # conteneur -- un mot de passe stocké peut être déchiffré
      # BIEN APRÈS le déploiement (voir credential_crypto.py).
      - SSH_TUNNELS_CRED_PASSPHRASE=${SSH_TUNNELS_CRED_PASSPHRASE:-}
      - SSH_TUNNELS_CRED_SALT=${SSH_TUNNELS_CRED_SALT:-}
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    volumes:
      # SSH_TUNNELS_DATA_DIR (.env, optionnel) : même logique que
      # GED_DATA_DIR/SCHEMA_ANALYZER_DATA_DIR -- sort la base
      # (connexions/tunnels/montages) de l'arborescence du projet.
      - ${SSH_TUNNELS_DATA_DIR:-./ssh-tunnels/data}:/data
      # SSH_TUNNELS_KEYS_DIR : dossier RÉEL sur l'hôte contenant les
      # clés privées autorisées -- OBLIGATOIREMENT en LECTURE SEULE
      # (":ro") -- ce service ne doit JAMAIS pouvoir modifier ou
      # créer une clé, seulement en lire l'empreinte/le type via
      # ssh-keygen. Vide = ./ssh-tunnels/keys comme repli (dossier
      # à peupler manuellement, jamais créé avec un contenu par
      # défaut).
      - ${SSH_TUNNELS_KEYS_DIR:-./ssh-tunnels/keys}:/keys
      # SSH_TUNNELS_MOUNTS_DIR (livraison #180) : dossier RÉEL sur
      # l'hôte où les partages SSHFS montés DEVRAIENT devenir
      # visibles.
      #
      # ⚠️ CORRIGÉ (livraison #355) -- `bind: propagation: rshared`
      # (présent ici jusqu'à cette livraison, jamais vérifié en
      # conditions réelles avant, comme le disait honnêtement le
      # commentaire d'origine) empêchait le conteneur de démarrer DU
      # TOUT sur macOS (Docker Desktop) : "path .../ssh-tunnels/mounts
      # is mounted on /host_mnt/Users but it is not a shared mount" --
      # signalé en conditions réelles par la personne. Confirmé par
      # recherche : limitation CONNUE et ANCIENNE de Docker Desktop
      # (moby/moby#39093, 2019, toujours d'actualité) -- contrairement
      # à Linux natif, la correction habituelle (`mount --make-rshared`
      # sur l'hôte) NE FONCTIONNE PAS de façon fiable sur Docker
      # Desktop pour Mac/Windows d'après plusieurs retours concordants
      # -- pas un réglage à ajuster, une limitation de fond de sa
      # virtualisation.
      #
      # Compromis assumé : propagation RETIRÉE par défaut -- le
      # conteneur démarre partout (macOS/Windows/Linux), mais un
      # montage SSHFS fait DANS le conteneur ne devient PLUS visible
      # depuis l'explorateur de fichiers de l'hôte (Finder/Explorateur)
      # -- reste consultable UNIQUEMENT depuis l'intérieur du
      # conteneur (donc toujours exploitable par une future route API
      # qui en lirait le contenu). La gestion des tunnels/montages via
      # l'API elle-même n'est PAS affectée -- ce compromis touche
      # SEULEMENT la visibilité du contenu monté côté hôte.
      #
      # Sur un hôte Linux NATIF (pas Docker Desktop), la propagation
      # `rshared` fonctionne normalement -- pour la retrouver,
      # remplacer la ligne "- ${SSH_TUNNELS_MOUNTS_DIR..." ci-dessous
      # par le bloc long form :
      #   - type: bind
      #     source: ${SSH_TUNNELS_MOUNTS_DIR:-./ssh-tunnels/mounts}
      #     target: /mounts
      #     bind:
      #       propagation: rshared
      - ${SSH_TUNNELS_MOUNTS_DIR:-./ssh-tunnels/mounts}:/mounts
    depends_on:
      - memcached

  rsyslog-listener:
    # Livraison #177, backlog BACKLOG.md #3 étape 4/4 -- écoute UDP
    # syslog (RFC 3164/5424), dernière étape de l'initiative "logs de
    # toutes sortes". Port UDP exposé DIRECTEMENT sur l'hôte
    # (RSYSLOG_LISTENER_PORT ci-dessous) -- CONTRAIREMENT à tous les
    # autres services de ce projet (atteints via tls-proxy, HTTP
    # uniquement) : syslog est un protocole réseau BRUT, ne peut pas
    # transiter par un reverse proxy HTTP. /health et /logs restent
    # accessibles via tls-proxy comme les autres (voir
    # render_nginx_conf.py), pour le diagnostic uniquement -- jamais
    # le flux syslog lui-même.
    build:
      context: .
      dockerfile: rsyslog-listener/Dockerfile
    environment:
      - MEMCACHED_HOST=memcached
      # Port UDP d'ÉCOUTE, à l'INTÉRIEUR du conteneur -- distinct du
      # port PUBLIÉ sur l'hôte (RSYSLOG_LISTENER_PORT dans .env,
      # voir "ports:" ci-dessous) -- même distinction que
      # GATEWAY_PORT vs le port interne 8080 de Keycloak ailleurs
      # dans ce projet.
      - RSYSLOG_LISTEN_PORT=5514
      - RSYSLOG_SOURCE_NAME=${RSYSLOG_SOURCE_NAME:-rsyslog}
    ports:
      # RSYSLOG_LISTENER_PORT (.env, optionnel) : port UDP PUBLIÉ sur
      # l'hôte -- une machine distante pousse ses logs syslog
      # DIRECTEMENT ici (`logger -n <host> -P <port> ...` ou
      # équivalent côté source), jamais via GATEWAY_PORT. Vide =
      # 5514 comme repli (514, le port syslog standard, nécessite des
      # privilèges root sur l'hôte -- 5514 évite ça par défaut,
      # changeable si la personne préfère rediriger 514 elle-même).
      - "${RSYSLOG_LISTENER_PORT:-5514}:5514/udp"
    depends_on:
      - memcached

  imap-client-api:
    # Livraison #179, backlog BACKLOG.md #4 volet 1/4 -- connexion
    # IMAP (voir imap-client/README.md). UN SEUL compte configuré
    # pour l'instant (identifiants dans .env, pas de gestion
    # multi-comptes). Volet 2/4 (#189/#190) : gestion de dossiers +
    # règles de tri -- SEULE donnée persistante de ce module (volume
    # ci-dessous), le reste (connexion IMAP elle-même) reste SANS
    # ÉTAT (connexion neuve à chaque requête).
    build:
      context: .
      dockerfile: imap-client/api/Dockerfile
    environment:
      - MEMCACHED_HOST=memcached
      - IMAP_HOST=${IMAP_HOST:-}
      - IMAP_PORT=${IMAP_PORT:-993}
      - IMAP_USER=${IMAP_USER:-}
      - IMAP_PASSWORD=${IMAP_PASSWORD:-}
      - IMAP_USE_SSL=${IMAP_USE_SSL:-true}
      - IMAP_DEFAULT_FOLDER=${IMAP_DEFAULT_FOLDER:-INBOX}
      # Connecteur source (livraison #230, backlog item 4) -- appel
      # conteneur-à-conteneur vers le service `api` principal, même
      # motif que NEBULA_API_INTERNAL_URL (glpi/api/app.py, #208).
      - API_INTERNAL_URL=http://api:5000
      # RIGHTS_API_URL -- livraison #310, OPT-IN comme partout ailleurs.
      # Gardé sur les 10 routes d'écriture (dossiers, déplacement,
      # règles, interprètes) -- jamais la lecture, ni /interpret
      # (fonctionnellement une lecture malgré le verbe POST).
      - RIGHTS_API_URL=${IMAP_CLIENT_RIGHTS_API_URL:-}
    volumes:
      # IMAP_CLIENT_DATA_DIR (.env, optionnel) -- même logique que
      # GED_DATA_DIR/SCHEMA_ANALYZER_DATA_DIR : sort la base des
      # règles de tri de l'arborescence du projet.
      - ${IMAP_CLIENT_DATA_DIR:-./imap-client/data}:/data
    depends_on:
      - memcached
      - api

  glpi-api:
    # Livraison #192, backlog : "évolution d'intégration GLPI, une
    # tuile et une api pour utiliser l'api glpi et ses données dans
    # les autres tuiles du hub" (demande explicite). Cette livraison
    # couvre le "besoin immédiat" (import de l'inventaire Excel) --
    # PAS ENCORE l'exposition aux autres tuiles, volontairement laissé
    # pour une étape suivante. GLPI_BASE_URL pointe vers UN GLPI
    # EXISTANT, EXTERNE à ce projet (pas géré par ce docker-compose)
    # -- voir glpi/README.md pour la configuration attendue.
    #
    # ⚠️ Non vérifié contre un vrai GLPI dans cet environnement
    # (aucun accès réseau externe ici) -- toute la logique HTTP est
    # construite à partir de la documentation officielle de l'API
    # historique GLPI (apirest.php), voir glpi/api/glpi_client.py.
    build:
      context: .
      dockerfile: glpi/api/Dockerfile
    environment:
      - MEMCACHED_HOST=memcached
      # Branchement rights-api (livraison #294) -- OPT-IN, même motif
      # que les services précédents. Jamais actif par défaut.
      - RIGHTS_API_URL=${GLPI_RIGHTS_API_URL:-}
      - GLPI_BASE_URL=${GLPI_BASE_URL:-}
      - GLPI_APP_TOKEN=${GLPI_APP_TOKEN:-}
      - GLPI_USER_TOKEN=${GLPI_USER_TOKEN:-}
      - GLPI_LOGIN=${GLPI_LOGIN:-}
      - GLPI_PASSWORD=${GLPI_PASSWORD:-}
      # ⚠️ network-agent-api tourne en network_mode: host (#238-239)
      # -- HOST_IP, jamais le nom de service Docker (livraison #264,
      # export vers GLPI de ce que network-agent découvre).
      - NETWORK_AGENT_API_URL=http://${HOST_IP:-localhost}:${NETWORK_AGENT_HOST_PORT:-15000}
      # #437 : hôtes des agents si-agent -> GLPI, comparaison avec les
      # agents GLPI Agent (si-agent-api est un service Compose ordinaire).
      - SI_AGENT_API_URL=http://si-agent-api:5000
    depends_on:
      - memcached

  nebula-api:
    # Livraison #196, second "besoin immédiat" de la demande GLPI
    # (#192) : "importer les données d'un site sous nebula.zyxel.com".
    # Cette livraison couvre la CONNEXION et la CONSULTATION -- PAS
    # ENCORE l'import vers GLPI, volontairement laissé pour une étape
    # suivante une fois la connexion validée en conditions réelles.
    #
    # ⚠️ DEUX PRÉREQUIS BLOQUANTS côté organisation Nebula, à réunir
    # AVANT tout test réel (voir nebula/README.md) : licence Nebula
    # Pro Pack, ET une clé d'API obtenue via un dossier support Zyxel
    # (jamais en libre-service, confirmé par la doc officielle).
    #
    # ⚠️ Non vérifié contre une vraie API Nebula dans cet
    # environnement (aucun accès réseau externe ici) -- toute la
    # logique HTTP est construite à partir de la spécification
    # OpenAPI officielle, voir nebula/api/nebula_client.py.
    #
    # Import CSV (livraison #200) : volume de données persistant --
    # premier stockage de ce module, jusqu'ici purement passe-plat.
    build:
      context: .
      dockerfile: nebula/api/Dockerfile
    environment:
      - MEMCACHED_HOST=memcached
      - NEBULA_API_KEY=${NEBULA_API_KEY:-}
      - NEBULA_BASE_URL=${NEBULA_BASE_URL:-}
      # Archivage des CSV importés dans la GED (livraison #237) --
      # même motif que NEBULA_API_INTERNAL_URL/SNMP_API_INTERNAL_URL
      # déjà utilisés ailleurs dans ce projet.
      - GED_API_INTERNAL_URL=http://ged-api:5000
      # RIGHTS_API_URL -- livraison #314, OPT-IN comme partout ailleurs.
      # Gardé sur les 3 routes d'import CSV et les 2 routes de
      # suppression (lots importés) -- jamais la consultation.
      - RIGHTS_API_URL=${NEBULA_RIGHTS_API_URL:-}
    volumes:
      # NEBULA_DATA_DIR (.env, optionnel) : même logique que
      # PREFS_DATA_DIR/IMAP_CLIENT_DATA_DIR -- vide = valeur par
      # défaut ci-dessous, jamais un chemin absolu codé en dur.
      - ${NEBULA_DATA_DIR:-./nebula/data}:/data
    depends_on:
      - memcached
      - ged-api

  snmp-api:
    # Livraison #212, backlog item 13 -- module SNMP. Portée
    # VOLONTAIREMENT LIMITÉE, voir snmp/README.md et
    # snmp/api/snmp_client.py pour le détail complet des décisions
    # de portée prises pour pouvoir avancer plutôt que d'attendre
    # (SNMPv1/v2c uniquement, pas de scan de ports, pas de
    # "déploiement automatisé").
    # ⚠️ Jamais testé contre un vrai équipement SNMP dans cet
    # environnement (pysnmp non installable, réseau restreint).
    build:
      context: .
      dockerfile: snmp/api/Dockerfile
    environment:
      - MEMCACHED_HOST=memcached
      - SNMP_DEFAULT_PORT=161
      - SNMP_DEFAULT_TIMEOUT=5
      # Cibles enregistrées (livraison #213) -- optionnel : absent =
      # seul l'usage ponctuel (host+community en direct, /query et
      # /walk-interfaces) fonctionne, POST /targets refuse alors
      # clairement. Même motif que SSH_TUNNELS_CRED_* (#210) --
      # SNMP_CRED_SALT généré une seule fois, JAMAIS régénéré ensuite.
      - SNMP_CRED_PASSPHRASE=${SNMP_CRED_PASSPHRASE:-}
      - SNMP_CRED_SALT=${SNMP_CRED_SALT:-}
      # RIGHTS_API_URL -- livraison #313, OPT-IN comme partout ailleurs.
      # Scope étroit : gardé UNIQUEMENT sur create_target/delete_target
      # -- jamais /query ni /walk-interfaces (voir snmp/api/app.py
      # pour le raisonnement complet sur cette limite assumée).
      - RIGHTS_API_URL=${SNMP_RIGHTS_API_URL:-}
    volumes:
      - ${SNMP_DATA_DIR:-./snmp/data}:/data
    depends_on:
      - memcached

  network-agent-api:
    # Livraison #233, backlog item 20 -- agent d'exploration réseau
    # ACTIF, CLARIFIÉ avec la personne : UN SEUL agent (le VPN existant
    # sert de passerelle vers le réseau interne géré par Nebula), UNE
    # SEULE tuile hub. Voir network-agent/README.md pour le détail
    # complet des décisions de portée (heuristique de détection de
    # passerelle, modèle site/segment, simplifications assumées).
    #
    # ⚠️ tcpdump nécessite CAP_NET_RAW/CAP_NET_ADMIN -- SANS ces
    # capacités, la capture échoue proprement ("permission denied"),
    # géré par la boucle de réessai de app.py (jamais un crash de
    # service, voir /capture/status pour diagnostiquer).
    #
    # `network_mode: host` CONFIRMÉ NÉCESSAIRE (livraison #238) --
    # premier test réel de la personne : sans lui, l'interface `ens18`
    # de l'hôte (nommage Proxmox typique) est INVISIBLE depuis le
    # conteneur ("No such device exists"), qui ne voit que ses propres
    # interfaces virtuelles Docker -- jamais le vrai trafic réseau de
    # l'hôte/VPN. Contrepartie ACCEPTÉE en connaissance de cause : ce
    # conteneur quitte le réseau Docker interne partagé
    # (`supervision-si-net`) -- `memcached:11211` NE RÉSOUT PLUS
    # (dégradation SILENCIEUSE et SANS CRASH, voir
    # shared/log_buffer.py -- toute écriture Memcached déjà encapsulée
    # dans un `except Exception: pass`, seul le partage du journal
    # `/logs` de CE service en pâtit, jamais la capture elle-même) ;
    # `network-agent-api:5000` n'est PLUS joignable par son nom Docker
    # -- tls-proxy route désormais vers `host.docker.internal` pour ce
    # service précis (voir tls-proxy/render_nginx_conf.py et
    # gateway/docker-compose.yml, `extra_hosts`).
    build:
      context: .
      dockerfile: network-agent/api/Dockerfile
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      # `memcached` ne résout plus en network_mode:host -- laissé tel
      # quel volontairement (voir commentaire ci-dessus) : la
      # résolution échoue, l'écriture est simplement ignorée, jamais
      # un crash (chemin déjà testé, voir shared/log_buffer.py).
      - MEMCACHED_HOST=memcached
      - NETWORK_AGENT_INTERFACE=${NETWORK_AGENT_INTERFACE:-eth0}
      - NETWORK_AGENT_SITE_NAME=${NETWORK_AGENT_SITE_NAME:-}
      - NETWORK_AGENT_SEGMENT_LABEL=${NETWORK_AGENT_SEGMENT_LABEL:-}
      - NETWORK_AGENT_SEGMENT_CIDR=${NETWORK_AGENT_SEGMENT_CIDR:-}
      - NETWORK_AGENT_CAPTURE_ENABLED=${NETWORK_AGENT_CAPTURE_ENABLED:-true}
      # Port configurable (livraison #239) -- COLLISION RÉELLE trouvée
      # au déploiement (docker-registry occupait déjà 5000 sur
      # l'hôte -- ce conteneur, en network_mode: host, se lie
      # DIRECTEMENT sur un port de l'hôte, pas un port Docker isolé).
      # Défaut 15000 -- surcharger ICI si collision sur un autre port.
      - NETWORK_AGENT_HOST_PORT=${NETWORK_AGENT_HOST_PORT:-15000}
      # Résolution DNS (livraison #250) -- serveur spécifique
      # optionnel (vide = résolveur système, best-effort "depuis
      # l'hôte") et domaine par défaut retiré des noms résolus pour
      # un affichage plus court.
      - NETWORK_AGENT_DNS_SERVER=${NETWORK_AGENT_DNS_SERVER:-}
      - NETWORK_AGENT_DEFAULT_DOMAIN=${NETWORK_AGENT_DEFAULT_DOMAIN:-}
      # Relevés périodiques / rémanence (livraison #251) -- un
      # relevé par heure, conservé 30 jours par défaut.
      - NETWORK_AGENT_SNAPSHOT_INTERVAL_SECONDS=${NETWORK_AGENT_SNAPSHOT_INTERVAL_SECONDS:-3600}
      - NETWORK_AGENT_HISTORY_RETENTION_DAYS=${NETWORK_AGENT_HISTORY_RETENTION_DAYS:-30}
    volumes:
      - ${NETWORK_AGENT_DATA_DIR:-./network-agent/data}:/data
    depends_on:
      - memcached

  retro-api:
    # Livraison #243, backlog item 30 -- tuile "Rétro-ingénierie",
    # demandée explicitement en urgence : "vieille application...
    # aucune note, développeur génial avait ses schémas en tête".
    # Extrait des relations SQL CANDIDATES depuis du code PHP
