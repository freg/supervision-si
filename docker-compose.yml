      - VITE_BACKUP_RESTORE_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/backup-restore
      # Architecture réseau -- onglet hub (livraison #253), backend
      # #253.
      - VITE_ARCHITECTURE_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/architecture
      # Mémoire -- onglet hub (livraison #259), backend #259.
      - VITE_MEMORY_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/memory
      # Classification sémantique -- onglet hub (livraison #260).
      - VITE_CLASSIFIER_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/classifier
      # Vigilance -- onglet hub (livraison #262).
      - VITE_VIGILANCE_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/vigilance
      # Tâches (Kanban) -- onglet hub (livraison #271).
      - VITE_TASKS_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/tasks
      # Droits (livraison #283) -- onglet hub réservé à admin_hub.
