    environment:
      - GATEWAY_PORT=${GATEWAY_PORT:-6443}
      - VITE_LDAP_ADMIN_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/ldap-admin
