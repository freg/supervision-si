      - VITE_SUPERVISION_FRONTEND_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/app/
      - VITE_TICKETS_PORTAL_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/tickets/
      - VITE_DBA_PORTAL_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/dba/
      - VITE_LDAP_ADMIN_PORTAL_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/ldap-admin/
      - VITE_VAULT_PORTAL_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/vault/
      # Adresse LAN DIRECTE (http, pas https via la passerelle) --
      # même raisonnement que vault-admin-portal lui-même, jamais routé
      # par tls-proxy.
      - VITE_VAULT_ADMIN_PORTAL_URL=https://${HOST_IP:-localhost}:${VAULT_ADMIN_PORTAL_LAN_PORT:-6120}
      - VITE_PREFS_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/prefs
      # Rappel d'activité technicien -- le hub doit pouvoir interroger
