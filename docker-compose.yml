      - VITE_NETMAP_ORCHESTRATOR_API_BASE_URL=https://${HOST_IP:-localhost}:${GATEWAY_PORT:-6443}/api/netmap-orchestrator
      # Nebula + pont GLPI -- onglet hub (livraison #228), backend
