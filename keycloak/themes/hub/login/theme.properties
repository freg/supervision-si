# Thème de connexion "hub" -- livraison #275, demandé explicitement :
# "peux tu proposer des skins pour la mire keycloak ? et intégrer un
# skin par défaut qui soit cohérent avec le hub". Skin par DÉFAUT à
# intégrer, reprenant les jetons de design du hub (voir
# shared/theme.css, palette claire -- --bg/--panel/--border/--text/
# --accent...) -- voir keycloak/themes/README.md pour le raisonnement
# complet et les skins alternatifs.
#
# `parent=keycloak` -- hérite de TOUS les gabarits FreeMarker/la
# logique du thème classique Keycloak (formulaires, i18n,
# accessibilité, gestion des erreurs...), SEULEMENT le CSS est
# remplacé -- jamais de réimplémentation des templates, approche la
# plus robuste et la moins fragile aux montées de version (confirmée
# valable en Keycloak 26 par la documentation officielle Red Hat).
parent=keycloak
import=common/keycloak
styles=css/login.css
